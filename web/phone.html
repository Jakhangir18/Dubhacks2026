<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Side Camera</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; background: #070b10; color: #e8f3ec; font: 16px/1.4 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
    h1 { margin: 0; font-size: 18px; } h1 b { color: #9cff5a; }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid #24343a; color: #8aa39a; }
    .chip.on { color: #000; background: #9cff5a; border-color: #9cff5a; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
    video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; }
    button { font: inherit; font-size: 20px; padding: 14px 28px; border-radius: 12px; border: 0; background: #9cff5a; color: #000; }
    p { margin: 0; color: #8aa39a; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <header><h1><b>Zombie Walk Home</b> · side camera</h1><span id="st" class="chip">idle</span></header>
  <main>
    <video id="v" playsinline muted autoplay></video>
    <button id="go">Start the camera</button>
    <p>Put the phone on a stand at the side of the pad, knee height, the whole body in view. Keep this page open; the dashboard shows the picture.</p>
  </main>
  <canvas id="c" hidden></canvas>
  <script>
    // The phone's camera, as pictures to the game server: ten a second, 480 px on the long side, for the gait
    // analysis on the server and the dashboard's picture. No video is stored.
    const $ = (id) => document.getElementById(id);
    // Pictures go down one WebSocket, pipelined: a slow round trip over the internet never sets the frame rate.
    const FPS = 12, LONG = 640, IN_FLIGHT = 8;
    let timer = null, busy = 0, sent = 0, ws = null, lastCount = 0, lastAt = performance.now();
    function connect() {
      try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/sideframe`); } catch { ws = null; return; }
      ws.binaryType = 'arraybuffer';
      ws.onclose = () => { ws = null; setTimeout(connect, 1500); };
      ws.onerror = () => { try { ws.close(); } catch { /* already closed */ } };
    }
    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      $('v').srcObject = stream;
      $('go').hidden = true;
      try { await navigator.wakeLock?.request('screen'); } catch { /* the screen may still dim */ }
      connect();
      timer = setInterval(shot, 1000 / FPS);
      setInterval(() => {   // the chip says what really leaves the phone
        const now = performance.now(), rate = (sent - lastCount) / ((now - lastAt) / 1000);
        lastCount = sent; lastAt = now;
        const ok = (ws && ws.readyState === 1) || busy > 0;
        $('st').textContent = ok ? `sending · ${rate.toFixed(1)} a second · ${sent}` : 'no connection';
        $('st').classList.toggle('on', ok && rate > 0);
      }, 1000);
    }
    async function shot() {
      const v = $('v');
      if (!v.videoWidth) return;
      if (ws && ws.readyState === 1 && ws.bufferedAmount > 400000) return;   // the link is behind: skip this picture
      if (!(ws && ws.readyState === 1) && busy >= IN_FLIGHT) return;
      const scale = LONG / Math.max(v.videoWidth, v.videoHeight);
      const c = $('c'); c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.6));
      if (!blob) return;
      if (ws && ws.readyState === 1) { ws.send(blob); sent += 1; return; }
      busy += 1;   // no socket: plain uploads, several at once
      try {
        const r = await fetch('/api/sideframe', { method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob });
        if (r.ok) sent += 1;
      } catch { /* counted by the chip as no connection */ } finally { busy -= 1; }
    }
    $('go').onclick = () => start().catch((e) => { $('st').textContent = `camera: ${e.message}`; });
  </script>
</body>
</html>
