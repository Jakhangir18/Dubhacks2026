<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zombie Walk Home</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
    #handles { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .warp-handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
      background: #ff2d95; border: 3px solid #fff; color: #fff; font: 700 12px system-ui; display: grid;
      place-items: center; cursor: grab; pointer-events: auto; touch-action: none; }
    #keys { position: fixed; left: 12px; bottom: 10px; z-index: 20; color: #9aa; font-size: 13px;
      background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px; }
    #keys b { color: #7CFF4F; }
  </style>
  <!-- Phaser 3.80.1 (MIT) is vendored so the game runs with no Wi-Fi; the CDN is only a fallback -->
  <script src="vendor/phaser.min.js"></script>
  <script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>')</script>
  <script src="warp.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="handles"></div>
  <div id="keys">
    <b>A/D</b> step · <b>Q/E</b> high step · <b>W</b> auto-walk · <b>Space</b> pause · <b>C</b> corners ·
    <b>F</b> fullscreen · <b>M</b> voice on/off · <b>K</b> hide keys
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
